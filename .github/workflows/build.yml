name: Build Pure OpenWrt for VT-STREET-M2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pure-openwrt-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      OPENWRT_TAG: v25.12.5

    steps:
      - name: Checkout Pure Repository
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl time xsltproc ca-certificates

      - name: Fetch Clean OpenWrt Source
        run: |
          git init openwrt
          git -C openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt fetch origin refs/tags/$OPENWRT_TAG:refs/tags/$OPENWRT_TAG
          git -C openwrt checkout tags/$OPENWRT_TAG

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: pure-openwrt-dl-${{ env.OPENWRT_TAG }}

      - name: Inject fildunsky feed and install packages
        working-directory: openwrt
        run: |
          echo "src-git modem https://github.com/fildunsky/luci-app-5gmodem.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Board Support Files (Каноничный инжектор Максбакса)
        run: |
          OPENWRT_DIR="$PWD/openwrt"
          REPO_DIR="$PWD"

          # 1. Интеграция DTS платы + Включение нативного DSA автонаследования
          cp "$REPO_DIR/port/mt7621_vertell_vt-mt7621d.dts" \
            "$OPENWRT_DIR/target/linux/ramips/dts/mt7621_vertell_vt-mt7621d.dts"
          python3 - "$OPENWRT_DIR/target/linux/ramips/dts/mt7621_vertell_vt-mt7621d.dts" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          # Находим узел интерфейса LAN внутри DTS и вшиваем туда аппаратную ссылку на родительский eth0
          if 'label-macdevice' not in s:
              s = s.replace('device = &ethernet;', 'device = &ethernet;\n\t\tlabel-macdevice = &eth0;', 1)
              p.write_text(s)
          PY

          # 2. Интеграция Профиля платы в mt7621.mk
          PROFILE_FILE="$OPENWRT_DIR/target/linux/ramips/image/mt7621.mk"
          if ! grep -q '^define Device/vertell_vt-mt7621d$' "$PROFILE_FILE"; then
            printf '\n' >> "$PROFILE_FILE"
            cat "$REPO_DIR/port/vertell-profile.mk" >> "$PROFILE_FILE"
          fi

          # 3. КАННОНИЧНЫЙ ПАТЧ ПОРТОВ: Чистый LAN и принудительное UCI-клеймение портов для netifd
          NETWORK_FILE="$OPENWRT_DIR/target/linux/ramips/mt7621/base-files/etc/board.d/02_network"
          python3 - "$NETWORK_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          
          # Шаг А: Врезаем разметку портов под единственный lan1 (Каноничный чистый LAN-инжектор)
          lan_insert = (
              '\tvertell,vt-mt7621d)\n'
              '\t\tucidef_set_interface_lan "lan1"\n'
              '\t\t;;\n'
          )
          if '\tvertell,vt-mt7621d)\n' not in s:
              idx = s.find('case "$board" in')
              if idx < 0:
                  idx = s.find('case $board in')
              if idx < 0:
                  raise SystemExit('ERROR: Switch board case anchor not found in 02_network')
              next_line = s.find('\n', idx) + 1
              s = s[:next_line] + lan_insert + s[next_line:]

          # Шаг Б: Жесткое клеймение MAC-адреса через автоматическую генерацию config device для netifd
          mac_insert = (
              '\tvertell,vt-mt7621d)\n'
              '\t\t# Запрашиваем то, что ядро успело считать из DTS/Factory (eth0)\n'
              '\t\tlocal current_mac=$(cat /sys/class/net/eth0/address 2>/dev/null)\n'
              '\t\t\n'
              '\t\t# Если заводской MAC пустой или мусорный (нули/FF/рандом ядра), включаем принудительный фоллбэк\n'
              '\t\tif [ -z "$current_mac" ] || echo "$current_mac" | grep -qE "^(00:00:00:00:00:00|ff:ff:ff:ff:ff:ff|20:08:02|6e:57)"; then\n'
              '\t\t\tlocal h=$(head -c 64 /dev/mtd2 2>/dev/null | sha256sum | awk "{print \$1}")\n'
              '\t\t\tif [ -n "$h" ] && [ "$h" != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then\n'
              '\t\t\t\tlocal fallback_mac="02:$(echo "$h" | cut -c3-4):$(echo "$h" | cut -c5-6):$(echo "$h" | cut -c7-8):$(echo "$h" | cut -c9-10):$(echo "$h" | cut -c11-12)"\n'
              '\t\t\t\t\n'
              '\t\t\t\t# Перебиваем глобальный мак-эталон системы\n'
              '\t\t\t\tucidef_set_label_macaddr "$fallback_mac"\n'
              '\t\t\t\t\n'
              '\t\t\t\t# Намертво заставляем сетевой менеджер клеймить физический корень eth0 и мост br-lan\n'
              '\t\t\t\tucidef_set_network_device_mac "eth0" "$fallback_mac"\n'
              '\t\t\t\tucidef_set_network_device_mac "br-lan" "$fallback_mac"\n'
              '\t\t\tfi\n'
              '\t\tfi\n'
              '\t\t;;\n'
          )
          if 'ucidef_set_network_device_mac' not in s:
              mac_idx = s.find('ramips_setup_macs()')
              if mac_idx < 0:
                  raise SystemExit('ERROR: ramips_setup_macs anchor not found')
              case_idx = s.find('case', mac_idx)
              next_mac_line = s.find('\n', case_idx) + 1
              s = s[:next_mac_line] + mac_insert + s[next_mac_line:]
              
          p.write_text(s)
          PY

          
          # 4. ЗАЩИТА NAND-ОБНОВЛЕНИЯ: Python врезает плату в системный platform.sh (Как у Макса)
          UPGRADE_FILE="$OPENWRT_DIR/target/linux/ramips/mt7621/base-files/lib/upgrade/platform.sh"
          python3 - "$UPGRADE_FILE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          entry = '\tvertell,vt-mt7621d|\\\n'
          if entry not in s:
              needle = '\tcase "$board" in\n\tampedwireless,ally-00x19k|\\\n'
              insert = '\tcase "$board" in\n' + entry + '\tampedwireless,ally-00x19k|\\\n'
              if needle not in s:
                  raise SystemExit('ERROR: NAND upgrade case anchor not found in platform.sh')
              s = s.replace(needle, insert, 1)
              p.write_text(s)

          start = s.find(entry)
          end = s.find('\n\t\t;;', start)
          if start < 0 or end < 0 or 'nand_do_upgrade "$1"' not in s[start:end]:
              raise SystemExit('ERROR: VT-STREET-M2 is not routed to nand_do_upgrade')
          PY

          # 5. ИСПРАВЛЕНО: Копируем наш кастомный нативный пакет vtmodem напрямую в дерево OpenWrt
          rm -rf "$OPENWRT_DIR/package/vtmodem"
          cp -a "$REPO_DIR/package/vtmodem" "$OPENWRT_DIR/package/vtmodem"

          # 6. Переносим остальные плоские оверлеи (99-system-cleanups и т.д.)
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cp -r files/* openwrt/package/base-files/files/ 2>/dev/null || true

          # 7. Выдаем права на запуск нативным файлам в сборочном дереве
          chmod +x openwrt/package/base-files/files/etc/uci-defaults/* 2>/dev/null || true

          # 8. Загружаем базовую конфигурацию сборки
          cp config/seed.config openwrt/.config
          cd openwrt
          
          # ЖЕЛЕЗОБЕТОННЫЙ ИНЖЕКТОР: Дописываем флаг ПОСЛЕ копирования seed.config!
          # Теперь defconfig прочитает его и принудительно скомпилирует пакет vtmodem!
          echo "CONFIG_PACKAGE_vtmodem=y" >> .config
          
          make defconfig
          

      - name: Build OpenWrt Firmware
        run: |
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Upload Finished Images
        uses: actions/upload-artifact@v4
        with:
          name: pure-openwrt-vt-street-m2
          retention-days: 14
          path: openwrt/bin/targets/ramips/mt7621/*
